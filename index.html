<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velin — Launcher de Minecraft by Brhenja</title>
<meta name="description" content="Velin es un launcher de Minecraft para gestionar instancias, mods, mundos y más.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Velin — Launcher de Minecraft">
<meta property="og:description" content="Velin es un launcher de Minecraft para gestionar instancias, mods, mundos y más.">
<meta property="og:url" content="https://brhenja.github.io/Velin/">
<meta property="og:image" content="https://brhenja.github.io/Velin/icon.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&display=swap">
<style>
/* Layout: launcher medieval. Categorías arriba, grilla de carátulas 2:3 al centro,
   franja de detalle del ítem elegido y barra de atajos abajo. Paleta marrón de Velin, un solo look. */
:root {
  --bg-dark: #2a1a0d;
  --bg-mid: #4a2f17;
  --bg-light: #6b4521;
  --tan: #c4955f;
  --cream: #f1e2c4;
  --dim: #d3bd98;
  --ink: rgba(30, 18, 8, .55);
  --display: "Cinzel", Georgia, serif;
  --body: "MedievalSharp", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: linear-gradient(160deg, var(--bg-light) 0%, var(--bg-mid) 45%, var(--bg-dark) 100%) fixed, var(--bg-dark);
  color: var(--cream); font: 17px/1.6 var(--body);
}
#dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

#app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Categorías ---------- */
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 12px; }
.brand { font: 900 24px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 3px 0 rgba(0, 0, 0, .45); white-space: nowrap; }
.center { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding-right: 150px; }
.pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 4px; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  appearance: none; border: 2px solid transparent; background: transparent; cursor: pointer; white-space: nowrap;
  font: 700 16px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  padding: 12px 20px; transition: transform .12s ease-out, background .12s;
}
.pill .count { margin-left: 8px; color: var(--tan); font-weight: 500; }
.pill:hover { transform: scale(1.05); border-color: rgba(196, 149, 95, .5); }
.pill[aria-selected="true"] { background: var(--cream); color: var(--bg-dark); border-color: var(--tan); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); }
.pill[aria-selected="true"] .count { color: var(--bg-light); }
.pill:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }

.keycap {
  display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 8px;
  border: 2px solid var(--tan); background: rgba(0, 0, 0, .25); color: var(--cream);
  font: 700 12px/1 var(--display); cursor: pointer; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .35);
}
.keycap.shoulder { border-radius: 10px 10px 2px 2px; }
button.keycap:hover { background: rgba(196, 149, 95, .3); }

/* ---------- Escenario ---------- */
.stage { overflow: auto; min-height: 0; scrollbar-width: none; padding: 24px 8px 28px; display: grid; align-content: safe center; }
.stage::-webkit-scrollbar { display: none; }
.games { --cw: clamp(120px, calc((100vh - 340px) * .667), 200px); position: relative; display: grid; gap: 36px; justify-content: center; grid-template-columns: repeat(auto-fit, var(--cw)); }
.box {
  position: relative; display: block; aspect-ratio: 2 / 3; color: inherit; text-decoration: none; outline: none; cursor: pointer;
  border: 3px solid var(--tan); background: var(--bg-mid);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3), 0 7px 0 rgba(0, 0, 0, .35); transition: transform .12s ease-out;
}
.box .art { position: absolute; inset: 0; overflow: hidden; }
.box .art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.box .glyph {
  position: absolute; inset: 0 0 56px; display: grid; place-items: center;
  font: 900 calc(var(--cw) * .38)/1 var(--display); color: var(--cream); text-shadow: 0 4px 0 rgba(0, 0, 0, .45);
}
.box .icon { position: absolute; left: 50%; top: 42%; width: 62%; transform: translate(-50%, -50%); image-rendering: pixelated; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .35)); }
.box .title {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 8px 12px; text-align: center;
  font: 700 17px/1.15 var(--display); letter-spacing: .06em; text-transform: uppercase; text-wrap: balance;
  background: linear-gradient(180deg, rgba(20, 10, 3, 0), rgba(20, 10, 3, .85));
}
.box.selected { transform: scale(1.045); z-index: 2; }
.box.selected::before {
  content: ""; position: absolute; inset: -10px; border: 3px solid var(--cream);
  pointer-events: none; animation: blink 1.1s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: .3; } }

/* ---------- Detalle ---------- */
.spot {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px;
  padding: 14px 8px 12px; border-top: 3px solid var(--tan); background: var(--ink); box-shadow: inset 0 3px 0 rgba(0, 0, 0, .3);
}
.spot .info { min-width: 0; flex: 1 1 380px; }
.spot h2 { margin: 0; font: 700 30px/1.05 var(--display); letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 3px 0 rgba(0, 0, 0, .45); text-wrap: balance; }
.spot .meta { margin-top: 6px; font: 500 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--tan); }
.spot p { margin: 6px 0 0; max-width: 66ch; color: var(--dim); font-size: 16px; line-height: 1.5; }
.spot .side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; min-width: 0; }
.chips, .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { font: 400 13px var(--body); padding: 2px 10px; border: 2px solid rgba(196, 149, 95, .55); color: var(--dim); }
.btn {
  display: inline-block; text-decoration: none; color: var(--cream); font: 400 16px/1.2 var(--body); padding: 9px 16px;
  border: 2px solid var(--tan); background: linear-gradient(180deg, #8a5a2b, #5e3a1a);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .18), inset 0 -3px 0 rgba(0, 0, 0, .35); transition: transform .08s, background .15s;
}
.btn:hover { background: linear-gradient(180deg, #a06b35, #6e4521); }
.btn:active { transform: translateY(2px); }
.btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
@media (min-width: 701px) { .spot { min-height: 128px; } }

/* ---------- Atajos ---------- */
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 11px 8px; border-top: 3px solid var(--tan); background: rgba(20, 10, 3, .6); color: var(--dim); font: 400 14px var(--body);
}
.bar .url { font: 500 13px var(--display); letter-spacing: .1em; color: var(--tan); }
.hints { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.hint { display: inline-flex; align-items: center; gap: 8px; }
@media (hover: none) { .hints { display: none; } }

/* ---------- Paneles de texto ---------- */
.doc { max-width: 700px; margin: 0 auto; padding: 4px 4px 24px; }
.doc h1 { position: relative; margin: 0 0 28px; padding-bottom: 14px; font: 900 clamp(38px, 7vw, 60px)/1 var(--display); letter-spacing: .05em; text-transform: uppercase; text-shadow: 0 3px 0 rgba(0, 0, 0, .45); text-wrap: balance; }
.doc h1::after { content: ""; position: absolute; left: 0; bottom: 0; width: 280px; max-width: 100%; height: 3px; background: linear-gradient(90deg, var(--tan), rgba(196, 149, 95, 0)); }
.doc h2 { margin: 34px 0 12px; font: 700 20px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--tan); }
.doc p { margin: 0 0 14px; color: var(--cream); max-width: 62ch; }
.doc .note { font-size: 15px; color: var(--dim); }
.now { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; margin: 0; }
.now dt { font: 500 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--tan); padding-top: 4px; }
.now dd { margin: 0; min-width: 0; }
.now a { color: var(--cream); }

.rows { display: grid; gap: 12px; }
.row {
  display: flex; align-items: center; gap: 18px; padding: 16px 20px; min-width: 0;
  border: 3px solid var(--tan); background: rgba(30, 18, 8, .45); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3);
  color: inherit; text-decoration: none; transition: background .12s, transform .12s;
}
a.row:hover, a.row:focus-visible { background: rgba(196, 149, 95, .2); transform: translateX(4px); outline: none; }
.row .k { flex: 0 0 96px; font: 500 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--tan); }
.row .v { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font: 400 22px/1.25 var(--body); color: var(--cream); }
.row a.v { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(196, 149, 95, .6); }
.row .go { color: var(--tan); font: 700 16px var(--display); }
.copy { appearance: none; background: rgba(0, 0, 0, .25); border: 2px solid var(--tan); color: var(--cream); font: 400 14px var(--body); padding: 5px 12px; cursor: pointer; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .35); }
.copy:hover { background: rgba(196, 149, 95, .3); }

/* ---------- Arranque ---------- */
#boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #1d1109; animation: boot-out .35s ease-out 1s forwards; }
#boot .logo { text-align: center; animation: logo-in .7s ease-out both; }
#boot .logo span { display: block; font: 900 clamp(38px, 9vw, 72px)/1 var(--display); letter-spacing: .2em; padding-left: .2em; text-transform: uppercase; text-shadow: 0 4px 0 rgba(0, 0, 0, .5); }
#boot .load { width: 220px; height: 4px; margin: 22px auto 0; background: rgba(0, 0, 0, .45); border: 1px solid rgba(196, 149, 95, .4); overflow: hidden; }
#boot .load i { display: block; height: 100%; width: 100%; background: var(--tan); transform-origin: left; animation: load .9s ease-in-out both; }
@keyframes boot-out { to { opacity: 0; visibility: hidden; pointer-events: none; } }
@keyframes logo-in { from { opacity: 0; transform: scale(.96); } }
@keyframes load { from { transform: scaleX(0); } }

@media (max-width: 860px) { .center { padding-right: 0; } }
@media (max-width: 700px) {
  .center { flex-basis: 100%; }
  .center .keycap { display: none; }
  .brand { font-size: 21px; }
  .pill { font-size: 14px; padding: 10px 14px; }
  .games { gap: 28px 22px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spot h2 { font-size: 30px; }
  .spot .side { align-items: flex-start; }
  .chips, .actions { justify-content: flex-start; }
  .row { flex-wrap: wrap; gap: 6px 14px; }
  .row .k { flex-basis: 100%; }
  .bar { justify-content: flex-start; }
}
@media (max-width: 700px) and (max-height: 720px) { .spot p { display: none; } }
@media (prefers-reduced-motion: reduce) {
  #boot { display: none; }
  .box.selected::before { animation: none; }
  .box, .pill, .row { transition: none; }
}

[hidden] { display: none !important; }
#app { padding-right: max(76px, calc(env(safe-area-inset-right, 0px) + 70px)); }
.nav .center { padding-right: 0; }
.bar .url { text-decoration: none; }
.bar a.url:hover { color: var(--cream); text-decoration: underline; text-underline-offset: 4px; }


.toggles { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 10px; }
.tog {
  appearance: none; display: grid; justify-items: center; gap: 4px; width: 56px; padding: 9px 0 7px;
  border: 2px solid var(--tan); background: rgba(20, 10, 3, .7); color: var(--cream); cursor: pointer;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .35); transition: background .12s, opacity .12s;
}
.tog svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tog .lbl { font: 700 9px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.tog .slash { display: none; stroke-width: 2.2; }
.tog[aria-pressed="false"] { color: var(--dim); opacity: .65; }
.tog[aria-pressed="false"] .slash { display: inline; }
.tog:hover { background: rgba(196, 149, 95, .3); opacity: 1; }
.tog:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }

.doc.wide { max-width: 900px; }
.hero { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; margin-bottom: 22px; }
.hero-icon { width: 140px; height: auto; image-rendering: pixelated; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .35)); }
.hero h1 { margin: 0; padding: 0; font-size: clamp(48px, 9vw, 84px); }
.hero h1::after { display: none; }
.by { margin-top: 8px; font: 700 18px var(--display); letter-spacing: .14em; color: var(--dim); }
.btns { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 0 14px; }
.btn.big { font-size: 18px; padding: 12px 22px; }
.ver { margin: 0 0 8px; font: 500 14px var(--display); letter-spacing: .08em; color: var(--tan); }
.ver b { color: var(--cream); }

.log { display: grid; }
.entry { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 22px; padding: 16px 0; border-top: 2px solid rgba(196, 149, 95, .35); }
.entry:last-child { border-bottom: 2px solid rgba(196, 149, 95, .35); }
.entry .when { font: 700 13px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--tan); padding-top: 5px; }
.entry h3 { margin: 0 0 4px; font: 700 20px/1.2 var(--display); letter-spacing: .04em; }
.entry p { margin: 0; color: var(--dim); max-width: 60ch; }

.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 40px; }
.features h3 { margin: 0 0 8px; font: 700 18px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--tan); }
.features ul { margin: 0; padding-left: 1.1rem; font-size: 15px; line-height: 1.5; color: var(--cream); }
.features li { margin-bottom: 4px; }
.features li::marker { color: var(--tan); }

.faq details { border-top: 2px solid rgba(196, 149, 95, .45); }
.faq details:last-of-type { border-bottom: 2px solid rgba(196, 149, 95, .45); }
.faq summary { cursor: pointer; list-style: none; padding: 14px 34px 14px 0; position: relative; color: var(--cream); }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; position: absolute; right: 4px; top: 10px; font: 700 24px var(--display); color: var(--tan); }
.faq details[open] summary::after { content: "\2212"; }
.faq summary:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
.faq details p { margin: 0 0 16px; color: var(--dim); }
.faq a { color: var(--cream); }

@media (max-width: 700px) {
  #app { padding-right: max(60px, calc(env(safe-area-inset-right, 0px) + 54px)); }
  .tog { width: 44px; padding: 7px 0 5px; }
  .tog svg { width: 18px; height: 18px; }
  .tog .lbl { display: none; }
  .features { grid-template-columns: minmax(0, 1fr); }
  .entry { grid-template-columns: minmax(0, 1fr); }
  .hero-icon { width: 100px; }
  .games { gap: 28px 18px; }
  .stage { padding-left: 16px; padding-right: 8px; }
}

.thumb { position: absolute; inset: 0; }
.txt { display: contents; }
.mob { display: none; }
#totop { display: none; }
.box .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; background: #1a0f06; }
.box.has-shot .art { display: none; }
.box .icon.round { image-rendering: auto; border-radius: 50%; width: 58%; top: 43%; }
.games.wide { --ww: clamp(240px, calc((100vh - 340px) * 1.6), 400px); grid-template-columns: repeat(auto-fit, var(--ww)); }
.games.wide .box { aspect-ratio: 16 / 10; }
.box.wide .title { padding: 38px 12px 10px; font-size: 17px; }
.box.wide.has-shot .glyph { inset: 0 0 24px; font-size: 54px; padding-left: .08em; color: #fff; text-shadow: 0 3px 14px rgba(0, 0, 0, .7); }

@media (max-width: 700px) {
  html, body { height: auto; overflow: auto; }
  body { overflow-x: hidden; }
  #dust { display: none; }
  #app { display: block; height: auto; min-height: 100vh; position: relative; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav { gap: 12px; padding-block: 16px 10px; }
  .brand { font-size: 24px; }
  .center { flex-basis: 100%; padding: 0; }
  .pills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; overflow: visible; padding: 0; width: 100%; }
  .pill { text-align: center; padding: 14px 4px; font-size: 14px; letter-spacing: .08em; border: 2px solid rgba(196, 149, 95, .5); background: rgba(0, 0, 0, .22); }
  .pill .count { display: none; }
  .pill[aria-selected="true"] { border-color: var(--tan); }
  .pill:hover { transform: none; }
  .stage { overflow: visible; display: block; padding: 18px 0 24px; }
  .games, .games.wide { --cw: 76px; grid-template-columns: minmax(0, 1fr); gap: 12px; justify-content: stretch; }
  .box, .games.wide .box { display: flex; align-items: center; gap: 14px; aspect-ratio: auto; padding: 10px; border-width: 2px; background: rgba(30, 18, 8, .5); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3), 0 4px 0 rgba(0, 0, 0, .3); }
  .box.selected { transform: none; }
  .box.selected::before { display: none; }
  .thumb { position: relative; inset: auto; flex: 0 0 76px; aspect-ratio: 2 / 3; border: 2px solid var(--tan); box-shadow: 0 4px 0 rgba(0, 0, 0, .3); overflow: hidden; }
  .box .glyph { inset: 0; font-size: 28px; }
  .box .title { position: static; padding: 0; text-align: left; background: none; font-size: 18px; }
  .box.wide .title { padding: 0; font-size: 18px; }
  .txt { display: block; min-width: 0; flex: 1 1 auto; }
  .mob { display: block; margin-top: 4px; }
  .mob .mk { display: block; font: 500 12px/1.3 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--tan); }
  .mob .md { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; font-size: 15px; line-height: 1.4; color: var(--dim); }
  .box.wide, .games.wide .box.wide { flex-direction: column; align-items: stretch; gap: 0; padding: 0; }
  .box.wide .thumb { flex: none; width: 100%; aspect-ratio: 16 / 10; border-width: 0 0 2px; box-shadow: none; }
  .box.wide .txt { padding: 12px 14px 14px; }
  .box.wide.has-shot .glyph { inset: 0; font-size: 44px; }
  .spot { display: none; }
  .doc { padding: 0 0 12px; }
  .toggles { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; flex-direction: row; gap: 8px; }
  .tog { width: 44px; height: 44px; padding: 0; align-content: center; }
  .bar { position: static; margin-top: 4px; padding: 14px 0 24px; }
  #totop { display: inline-block; }
}

.games.wide { --ww: clamp(240px, calc((100vh - 340px) * 1.4), 360px); }
.box.wide { border: 0; box-shadow: 0 8px 22px rgba(0, 0, 0, .45); }
@media (max-width: 700px) {
  .nav { padding-block: 14px 10px; gap: 14px; }
  .brand { line-height: 44px; }
  .box.wide, .games.wide .box.wide { border: 0; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
  .box.wide .thumb { border: 0; }
}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><div class="logo"><span id="boot-name"></span><div class="load"><i></i></div></div></div>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="app">
  <header class="nav">
    <div class="brand"></div>
    <div class="center">
      <button class="keycap shoulder" id="prev" type="button" aria-label="Categoría anterior">Q</button>
      <div class="pills" id="pills" role="tablist" aria-label="Categorías"></div>
      <button class="keycap shoulder" id="next" type="button" aria-label="Categoría siguiente">E</button>
    </div>
  </header>
  <main class="stage" id="stage"></main>
  <section class="spot" id="spot" aria-live="polite">
    <div class="info"><h2 id="spot-title"></h2><div class="meta" id="spot-meta"></div><p id="spot-desc"></p></div>
    <div class="side"><div class="chips" id="spot-chips"></div><div class="actions" id="spot-actions"></div></div>
  </section>
  <footer class="bar"><span class="bar-left"></span><button class="copy" id="totop" type="button">↑ Categorías</button></footer>
</div>
<div class="toggles" role="group" aria-label="Sonido">
  <button class="tog" id="tog-music" type="button" aria-pressed="true" aria-label="Música de fondo" title="Música de fondo">

  </button>

  }

  /* ---------- Arranque ---------- */
  function fromHash() { var h = (location.hash || "").slice(1); if (C.aliases && C.aliases[h]) h = C.aliases[h]; for (var k = 0; k < cats.length; k++) if (cats[k].id === h) return k; return -1; }
  var s0 = fromHash(); setCat(s0 < 0 ? 0 : s0);
  window.addEventListener("hashchange", function () { var k = fromHash(); if (k >= 0 && k !== state.cat) setCat(k); });
  loadRelease();
  setTimeout(function () { var b = $("#boot"); if (b) b.remove(); }, 1500);

  /* ---------- Brasas de fondo ---------- */
  var cv = $("#dust"), ctx = cv.getContext("2d"), W, H, parts = [], reduce = matchMedia("(prefers-reduced-motion: reduce)").matches || matchMedia("(max-width: 700px)").matches, raf;
  function size() { var dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function seedP() { parts = []; var n = Math.round(Math.min(60, W * H / 20000)); for (var i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 1.6, v: .1 + Math.random() * .25, a: .12 + Math.random() * .4, p: Math.random() * 6 }); }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i]; if (!reduce) { p.y -= p.v; p.x += Math.sin(t / 2500 + p.p) * .15; if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; } }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fillStyle = "rgba(245,196,120," + p.a + ")"; ctx.fill();
    }
    if (!reduce) raf = requestAnimationFrame(draw);
  }
  size(); seedP(); draw(0);
  addEventListener("resize", function () { size(); seedP(); if (reduce) draw(0); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) cancelAnimationFrame(raf); else if (!reduce) raf = requestAnimationFrame(draw); });
})();

</script>
